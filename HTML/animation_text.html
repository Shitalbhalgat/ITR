
<!DOCTYPE html>
<html>
<head>
    <title>Animation Range Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .space {
            height: 100vh;
            background: lightgray;
            display: grid;
            place-items: center;
        }

        .content {
            height: 100vh;
            display: grid;
            place-items: center;
        }

        h1 {
            color: red;
            font-size: 50px;

            animation: reveal  2s linear both;
            animation-timeline: view();
            animation-range: entry 30% cover 100%;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(200px) scale(0.3);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1.5);
            }
        }
    </style>
</head>
<body>

    <div class="space">
        <h2>Scroll Down</h2>
    </div>

    <div class="content">
        <h1>WELCOME TO CSS!</h1>
    </div>

    <div class="space">
        <h2>End</h2>
    </div>

</body>
</html>
