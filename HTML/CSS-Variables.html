<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Variables</title>

    <style>
        /* Define variables */
        :root {
            --main-color: #1769aa;
            --background-color: #f1f5f9;
            --card-padding: 25px;
            --card-radius: 12px;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
        }

        h1 {
            color: var(--main-color);
            text-align: center;
        }

        .card {
            background-color: white;
            padding: var(--card-padding);
            border-radius: var(--card-radius);
            margin: 20px;
            text-align: center;
        }

        button {
            background-color: var(--main-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>CSS Variables</h1>

    <div class="card">
        <h2>HTML Course</h2>
        <p>Learn HTML and build web pages.</p>
        <button>Learn More</button>
    </div>

    <div class="card">
        <h2>CSS Course</h2>
        <p>Learn CSS and style web pages.</p>
        <button>Learn More</button>
    </div>

</body>
</html>
